; ESP32-FSD CAN-only build for Waveshare ESP32-S3-RS485-CAN (16MB flash).
; No WiFi / Bluetooth / OTA / dashboard. Only stable CAN + FSD activation + speed control.

[platformio]
src_dir = ESP32S3CAN-FSD

[env:waveshare_ESP32_S3_RS485_CAN]
platform  = espressif32
board     = esp32s3box
framework = arduino

board_build.flash_size = 16MB
; Single-app, no-OTA partition table; radios/network features are stripped.
board_build.partitions = huge_app.csv

build_flags =
    -DTWAI_TX_PIN=GPIO_NUM_15
    -DTWAI_RX_PIN=GPIO_NUM_16
    -DTWAI_RX_QUEUE_LEN=64
    -DTWAI_TX_QUEUE_LEN=16
    -std=gnu++17
build_unflags = -std=gnu++11

monitor_speed = 115200

; ---------------------------------------------------------------------------
; LILYGO T-2CAN dual CAN.
;   Physical CANA : MCP2515 over SPI, SCK12/MOSI11/MISO13/CS10/RST9/INT8.
;   Physical CANB : ESP32-S3 native TWAI, GPIO7(TX)/GPIO6(RX).
; Firmware legacy labels:
;   bus=1 / TWAI    / physical CANB
;   bus=2 / MCP2515 / physical CANA
; ---------------------------------------------------------------------------
[env:lilygo_t2can_arduino_webui]
platform  = espressif32
board     = esp32s3box
framework = arduino

board_build.flash_size = 16MB
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi

lib_deps =
    autowp/autowp-mcp2515

build_flags =
    -DTWAI_TX_PIN=GPIO_NUM_7
    -DTWAI_RX_PIN=GPIO_NUM_6
    -DTWAI_RX_QUEUE_LEN=64
    -DTWAI_TX_QUEUE_LEN=16
    -DLILYGO_T2CAN
    -DENABLE_CANB_MCP2515
    -DMCP2515_SCK=12
    -DMCP2515_MOSI=11
    -DMCP2515_MISO=13
    -DMCP2515_CS=10
    -DMCP2515_RST=9
    -DMCP2515_INT=8
    -DMCP2515_CLOCK=MCP_16MHZ
    -DENABLE_LIGHT_WEBUI
    -DBOARD_HAS_PSRAM
    -DREC_CAP=100000
    -std=gnu++17
build_unflags = -std=gnu++11

monitor_speed = 115200
