; Isolated PlatformIO build config.
; Use with:
;   $env:PLATFORMIO_CORE_DIR="$PWD\.pio-core"
;   pio run --project-conf platformio.isolated.ini -e lilygo_t2can_arduino_webui
;
; This keeps platforms/packages under the project-local .pio-core directory and
; avoids modifying the global C:\Users\Administrator\.platformio package set.

[platformio]
src_dir = ESP32S3CAN-FSD

[env:waveshare_ESP32_S3_RS485_CAN]
platform  = file://C:/Users/Administrator/.platformio/platforms/espressif32@src-2462c5106a7b03244dd4103718a30b9e
board     = esp32s3box
framework = arduino

board_build.flash_size = 16MB
board_build.partitions = huge_app.csv

build_flags =
    -DTWAI_TX_PIN=GPIO_NUM_15
    -DTWAI_RX_PIN=GPIO_NUM_16
    -DTWAI_RX_QUEUE_LEN=64
    -DTWAI_TX_QUEUE_LEN=16
    -std=gnu++17
build_unflags = -std=gnu++11

monitor_speed = 115200

[env:lilygo_t2can_arduino_webui]
platform  = file://C:/Users/Administrator/.platformio/platforms/espressif32@src-2462c5106a7b03244dd4103718a30b9e
board     = esp32s3box
framework = arduino

board_build.flash_size = 16MB
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi

lib_deps =
    autowp/autowp-mcp2515

build_flags =
    -DTWAI_TX_PIN=GPIO_NUM_7
    -DTWAI_RX_PIN=GPIO_NUM_6
    -DTWAI_RX_QUEUE_LEN=64
    -DTWAI_TX_QUEUE_LEN=16
    -DLILYGO_T2CAN
    -DENABLE_CANB_MCP2515
    -DMCP2515_SCK=12
    -DMCP2515_MOSI=11
    -DMCP2515_MISO=13
    -DMCP2515_CS=10
    -DMCP2515_RST=9
    -DMCP2515_INT=8
    -DMCP2515_CLOCK=MCP_16MHZ
    -DENABLE_LIGHT_WEBUI
    -DBOARD_HAS_PSRAM
    -DREC_CAP=100000
    -std=gnu++17
build_unflags = -std=gnu++11

monitor_speed = 115200
